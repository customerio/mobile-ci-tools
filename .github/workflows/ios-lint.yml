name: iOS Lint

on:
  workflow_call:
    inputs:
      runner-label:
        description: 'Runner label to run on (e.g. macos-26, xcode-27).'
        required: false
        type: string
        default: 'macos-26'
      timeout-minutes:
        description: 'Maximum minutes the job may run before it is cancelled. The default is GitHub''s own limit of 360, so callers that do not set it see no change.'
        required: false
        type: number
        default: 360
      xcode-version:
        description: 'Xcode version to select, e.g. "27.0". SwiftLint loads the selected Xcode''s toolchain, so pin it when the job can run on more than one image. Images differ in their default Xcode. Leave empty to use the image default, which is what callers that do not set it get.'
        required: false
        type: string
        default: ''

jobs:
  format-and-lint:
    name: Assert that code has been linted and formatted
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Skips its steps when xcode-version is empty, so an unpinned job keeps the image default.
      - name: Select Xcode
        uses: customerio/mobile-ci-tools/github-actions/ios/setup-ios/v1@main
        with:
          xcode-version: ${{ inputs.xcode-version }}

      # Records the runner image, macOS and Xcode in the log and job summary, so a run on any image says what it
      # used. Reporting only: a failed inspection must not fail lint. The step limit bounds a hung simulator query,
      # which has no command-level timeout.
      - name: Report the toolchain
        uses: customerio/mobile-ci-tools/github-actions/ios/report-toolchain/v1@main
        continue-on-error: true
        timeout-minutes: 3

      - name: Install binny to run lint tools
        # arm64 asset, not x86_64: every macOS image is arm64, and the x86_64 binary only ran
        # because Rosetta happened to be installed on macos-14. -f so a 404 fails here rather
        # than writing an error page to ./binny and failing later inside `make format`.
        run: |
          curl -fL --output binny https://github.com/customerio/binny/releases/download/latest/binny-macos-m1
          chmod +x binny
        shell: bash

      - name: Run swiftformat. Fail if any errors.
        run: make format && git diff --exit-code
        shell: bash

      - name: Run swiftlint. Fail if any errors.
        run: make lint
        shell: bash
