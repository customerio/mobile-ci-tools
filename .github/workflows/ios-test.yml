name: iOS Tests

on:
  workflow_call:
    inputs:
      runner-label:
        description: 'Runner label to run on (e.g. macos-26, xcode-27).'
        required: false
        type: string
        default: 'macos-26'
      xcode-version:
        description: 'Xcode version to select. Leave empty on preview images (xcode-27) where only one Xcode is installed.'
        required: false
        type: string
        default: '26.6'
      ruby-version:
        description: 'Ruby version to install for Fastlane. Must match what the calling repo''s Gemfile.lock resolves against.'
        required: false
        # Transitional default. A caller's Gemfile.lock is resolved against one Ruby line, and a
        # lock resolved on 3.4 will not install on 3.2 (fastlane 2.237 admits excon 1.7, which
        # needs >= 3.3). Keeping 3.2 here means merging this change alone is a no-op; each caller
        # moves to '3.4' in the same PR that bumps its own lock. Drop this default once both
        # customerio-ios and customerio-ios-fcm pass the input explicitly.
        type: string
        default: '3.2'
      scheme:
        description: 'Xcode scheme name to test'
        required: true
        type: string
      xcresult-name:
        description: 'Name of the xcresult bundle (e.g., "MyApp.xcresult")'
        required: true
        type: string
    secrets:
      CODECOV_UPLOAD_TOKEN:
        description: 'Codecov upload token'
        required: false

jobs:
  automated-tests:
    runs-on: ${{ inputs.runner-label }}
    permissions:
      checks: write # Need write permission to add test result check.
    env:
      CODECOV_UPLOAD_TOKEN: ${{ secrets.CODECOV_UPLOAD_TOKEN }}
    steps:
    - uses: actions/checkout@v4

    # Xcode 26.x is a floor, not a preference: SPM needs Swift 6.1+ to parse firebase-ios-sdk's
    # manifest (trailing commas in call argument lists). Do not lower the default below 26.
    - name: Setup iOS
      uses: customerio/mobile-ci-tools/github-actions/ios/setup-ios/v1@main
      with:
        xcode-version: ${{ inputs.xcode-version }}

    # If running tests fails, sometimes it's because of scheme name is wrong. This gives us all available schemes.
    - name: Get XCode schemes 
      run: xcrun xcodebuild -list

    - name: Setup Ruby to run Fastlane 
      uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
      with:
        ruby-version: ${{ inputs.ruby-version }}
        bundler-cache: true # install dependencies in Gemfile, including Fastlane.

    - name: Run tests 
      uses: maierj/fastlane-action@5a3b971aaa26776459bb26894d6c1a1a84a311a7 # v3.1.0
      with:
        lane: 'scan'

    # https://about.codecov.io/blog/pre-converting-xcresult-files-for-codecov-using-xcresultparser/
    - name: Generate code coverage report from .xcresult/ that can be converted to codecov format
      run: |
        brew tap a7ex/homebrew-formulae && brew install xcresultparser
        xcresultparser --output-format cobertura "${{ inputs.xcresult-name }}" > ".build/coverage.xml"
      if: env.CODECOV_UPLOAD_TOKEN != ''
  
    - name: Upload code coverage report 
      uses: codecov/codecov-action@0f8570b1a125f4937846a11fcfa3bcd548bd8c97 # v4.6.0
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_UPLOAD_TOKEN }} 
      with: 
        files: .build/coverage.xml
        fail_ci_if_error: true # fail if upload fails so we can catch it and fix it right away.
        verbose: true
      if: env.CODECOV_UPLOAD_TOKEN != '' 

    - name: Upload test report 
      uses: actions/upload-artifact@v4
      with:
        name: xcode-test-report
        path: test-report.*
      if: ${{ always() }}
      
    - name: Publish test results
      uses: mikepenz/action-junit-report@db71d41eb79864e25ab0337e395c352e84523afe  # v4.3.1
      with:
        check_name: XCode macOS tests - Results
        report_paths: test-report.xml
        github_token: ${{ secrets.GITHUB_TOKEN }}
        fail_on_failure: true
        require_tests: true
      if: ${{ always() }} # if running tests fails, we still want to parse the test results

