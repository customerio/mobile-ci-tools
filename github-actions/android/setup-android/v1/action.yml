name: Setup Android
description: Setup CI with Android development tools to compile, test, and publish Android source code.

inputs:
  gradle-version:
    description: 'Gradle version to use'
    required: false
    default: '8.14'
  java-version:
    description: 'Java version to install'
    required: false
    default: '17'

runs:
  using: "composite"
  steps:
    - name: Install Java
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: 'zulu'
        java-version: ${{ inputs.java-version }}

    - name: Install Android SDK
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

    - name: Verify Gradle scripts are valid
      uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

    - name: Setup Gradle and cache dependencies
      uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      with:
        gradle-version: ${{ inputs.gradle-version }}
